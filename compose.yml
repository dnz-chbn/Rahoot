name: rahoot

services:
  rahoot:
    build:
      context: .
      dockerfile: Dockerfile
    image: rahoot:local
    container_name: rahoot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WEB_ORIGIN=http://localhost:3000
      - CONFIG_PATH=/app/config
      - DATA_PATH=/app/data
    volumes:
      - ./config:/app/config # quiz seed files + game.json
      - ./data:/app/data # SQLite database (rahoot.db)
