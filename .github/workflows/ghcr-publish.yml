name: Publish image to GHCR

# Build the Docker image on GitHub's runners and push it to the GitHub
# Container Registry (ghcr.io) on every push to main. The homecloud server
# then just PULLS this prebuilt image instead of building from source.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/FUNDING.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rahoot:latest
            ghcr.io/${{ github.repository_owner }}/rahoot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
